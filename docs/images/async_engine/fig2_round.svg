<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 792 632" role="img" aria-label="Flowchart of one round: collect fresh rollouts, evict stale samples and build training batches, train while rollout engines keep generating, then synchronize weights and loop back.">
  <style>
    .t  { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 13.5px; fill: #22272E; }
    .ts { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 11.5px; fill: #5A6472; }
    .tb { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 13.5px; font-weight: 600; fill: #22272E; }
    .tw { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
    .tmono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5A6472; }
  </style>

  <rect x="-16" y="-16" width="792" height="632" rx="10" fill="#FFFFFF" stroke="#D8D5CC"/>
    <defs>
      <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#5A6472"/>
      </marker>
    </defs>

    <!-- Step 1 -->
    <rect x="150" y="20" width="440" height="88" rx="10" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.5"/>
    <circle cx="188" cy="64" r="16" fill="#5A6472"/>
    <text x="188" y="69" text-anchor="middle" class="tw">1</text>
    <text x="218" y="54" class="tb">Collect a round’s worth of fresh rollouts</text>
    <text x="218" y="74" class="ts">Usually near-instant: the rollout engines generated this data</text>
    <text x="218" y="90" class="ts">while the previous round was training.</text>

    <line x1="370" y1="108" x2="370" y2="140" stroke="#5A6472" stroke-width="1.6" marker-end="url(#arr2)"/>

    <!-- Step 2 -->
    <rect x="150" y="146" width="440" height="88" rx="10" fill="#FFFFFF" stroke="#5A6472" stroke-width="1.5"/>
    <circle cx="188" cy="190" r="16" fill="#5A6472"/>
    <text x="188" y="195" text-anchor="middle" class="tw">2</text>
    <text x="218" y="180" class="tb">Evict stale samples, build training batches</text>
    <text x="218" y="200" class="ts">Drop samples older than the staleness bound (section 6), then</text>
    <text x="218" y="216" class="ts">shuffle the buffer into equal-sized mini-batches.</text>

    <line x1="370" y1="234" x2="370" y2="266" stroke="#5A6472" stroke-width="1.6" marker-end="url(#arr2)"/>

    <!-- Step 3 -->
    <rect x="150" y="272" width="440" height="104" rx="10" fill="#E3E5F8" stroke="#4C57C9" stroke-width="1.6"/>
    <circle cx="188" cy="322" r="16" fill="#4C57C9"/>
    <text x="188" y="327" text-anchor="middle" class="tw">3</text>
    <text x="218" y="304" class="tb">Train — multiple optimizer passes</text>
    <text x="218" y="324" class="ts">The training engines run a configurable number of passes</text>
    <text x="218" y="340" class="ts">over this round’s mini-batches (gradient accumulation inside).</text>
    <text x="218" y="362" class="ts" fill="#0E7C6E" font-weight="600">Meanwhile: rollout engines keep generating next round’s data.</text>

    <line x1="370" y1="376" x2="370" y2="408" stroke="#5A6472" stroke-width="1.6" marker-end="url(#arr2)"/>

    <!-- Step 4 -->
    <rect x="150" y="414" width="440" height="104" rx="10" fill="#F5E9D2" stroke="#B7791F" stroke-width="1.6"/>
    <circle cx="188" cy="464" r="16" fill="#B7791F"/>
    <text x="188" y="469" text-anchor="middle" class="tw">4</text>
    <text x="218" y="446" class="tb">Weight sync</text>
    <text x="218" y="466" class="ts">Briefly pause rollout, broadcast the updated policy weights to</text>
    <text x="218" y="482" class="ts">every rollout engine over NCCL, resume. The policy version</text>
    <text x="218" y="498" class="ts">increments by one. Details in section 5.</text>

    <!-- loop back -->
    <path d="M 590 466 C 700 466, 700 64, 594 64" stroke="#5A6472" stroke-width="1.6" fill="none" marker-end="url(#arr2)" stroke-dasharray="2 5"/>
    <text x="700" y="270" text-anchor="middle" class="ts" transform="rotate(90 700 270)">next round</text>

    <text x="370" y="560" text-anchor="middle" class="ts">One round  =  collect → build → train → sync  →  repeat</text>
  </svg>
