<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 832 272" role="img" aria-label="The replay buffer keeps samples from the current policy version and up to max_lag previous versions; older samples are evicted.">
  <style>
    .t  { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 13.5px; fill: #22272E; }
    .ts { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 11.5px; fill: #5A6472; }
    .tb { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 13.5px; font-weight: 600; fill: #22272E; }
    .tw { font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: #FFFFFF; }
    .tmono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #5A6472; }
  </style>

  <rect x="-16" y="-16" width="832" height="272" rx="10" fill="#FFFFFF" stroke="#D8D5CC"/>
    <!-- shelf line -->
    <line x1="60" y1="170" x2="740" y2="170" stroke="#5A6472" stroke-width="2.5"/>

    <!-- v6 evicted -->
    <g opacity="0.85">
      <rect x="80" y="86" width="120" height="84" rx="8" fill="#ECEBE6" stroke="#D8D5CC"/>
      <text x="140" y="118" text-anchor="middle" class="tb" fill="#8B94A0">version 6</text>
      <text x="140" y="138" text-anchor="middle" class="ts">too stale</text>
      <line x1="92" y1="98" x2="188" y2="158" stroke="#B0453B" stroke-width="2.4"/>
      <line x1="188" y1="98" x2="92" y2="158" stroke="#B0453B" stroke-width="2.4"/>
      <text x="140" y="196" text-anchor="middle" class="ts" fill="#B0453B">evicted</text>
    </g>

    <!-- kept window -->
    <rect x="228" y="66" width="392" height="118" rx="12" fill="none" stroke="#0E7C6E" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="424" y="52" text-anchor="middle" class="t" fill="#0E7C6E">kept in the replay buffer — staleness bound (max_lag = 2)</text>

    <rect x="244" y="86" width="112" height="84" rx="8" fill="#FFFFFF" stroke="#D8D5CC"/>
    <text x="300" y="118" text-anchor="middle" class="tb">version 7</text>
    <text x="300" y="140" text-anchor="middle" class="ts">lag = 2</text>

    <rect x="368" y="86" width="112" height="84" rx="8" fill="#FFFFFF" stroke="#D8D5CC"/>
    <text x="424" y="118" text-anchor="middle" class="tb">version 8</text>
    <text x="424" y="140" text-anchor="middle" class="ts">lag = 1</text>

    <rect x="492" y="86" width="112" height="84" rx="8" fill="#DCEFEB" stroke="#0E7C6E" stroke-width="1.6"/>
    <text x="548" y="118" text-anchor="middle" class="tb">version 9</text>
    <text x="548" y="140" text-anchor="middle" class="ts" fill="#0E7C6E">current — on-policy</text>

    <text x="424" y="216" text-anchor="middle" class="ts">The policy is at version 9. With max_lag = 2, samples from versions 7–9 may be trained on; version 6 is evicted.</text>
  </svg>
